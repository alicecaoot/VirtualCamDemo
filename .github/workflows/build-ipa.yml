name: Build VirtualCamDemo IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  actions: read

jobs:
  build-ipa:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install ldid
        run: brew install ldid || true

      - name: Install Theos
        run: |
          set -euo pipefail
          git clone --depth=1 --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "PATH=$HOME/theos/bin:$PATH" >> "$GITHUB_ENV"

      - name: Build application
        working-directory: app
        run: |
          set -euo pipefail
          export THEOS="${THEOS:-$HOME/theos}"
          export TARGET=iphone:clang:latest:14.0
          export ARCHS=arm64
          make clean || true
          if ! make all FINALPACKAGE=1; then
            echo "Theos failed, manual clang"
            OBJDIR=".theos/obj/arm64"
            mkdir -p "$OBJDIR/VirtualCamDemo.app"
            SDK=$(xcrun --sdk iphoneos --show-sdk-path)
            CLANG=$(xcrun --sdk iphoneos -f clang)
            COMMON="-isysroot $SDK -arch arm64 -miphoneos-version-min=14.0 -fobjc-arc -Wall"
            $CLANG $COMMON -c main.m -o $OBJDIR/main.m.o
            $CLANG $COMMON -c AppDelegate.m -o $OBJDIR/AppDelegate.m.o
            $CLANG $COMMON -c CameraViewController.m -o $OBJDIR/CameraViewController.m.o
            $CLANG $COMMON \
              -framework UIKit -framework Foundation -framework AVFoundation -framework AVKit \
              -framework PhotosUI -framework UniformTypeIdentifiers -framework QuartzCore \
              -o $OBJDIR/VirtualCamDemo.app/VirtualCamDemo \
              $OBJDIR/main.m.o $OBJDIR/AppDelegate.m.o $OBJDIR/CameraViewController.m.o
            cp Info.plist $OBJDIR/VirtualCamDemo.app/
            mkdir -p .theos/obj
            rm -rf .theos/obj/VirtualCamDemo.app
            cp -R $OBJDIR/VirtualCamDemo.app .theos/obj/
          fi
          find .. -type d -name 'VirtualCamDemo.app' | head

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$(find . -type d -name 'VirtualCamDemo.app' | head -n 1)"
          test -n "$APP"
          if [ ! -f "$APP/Info.plist" ]; then cp app/Info.plist "$APP/"; fi
          if command -v ldid >/dev/null 2>&1; then
            ldid -Sapp/entitlements.plist "$APP/VirtualCamDemo" || ldid -S "$APP/VirtualCamDemo"
          fi
          file "$APP/VirtualCamDemo"
          mkdir -p dist/Payload
          rm -rf dist/Payload/*
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qr VirtualCamDemo.ipa Payload)
          ls -lah dist/VirtualCamDemo.ipa
          unzip -l dist/VirtualCamDemo.ipa | head

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtualCamDemo-ipa
          path: dist/VirtualCamDemo.ipa
          if-no-files-found: error
          retention-days: 14
